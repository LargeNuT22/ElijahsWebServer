server {
	server_name payment.divinity.fitness;
	add_header Permissions-Policy "payment=(*)";
	location / {
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header Host $host;
		proxy_pass http://127.0.0.1:12600;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";

	}

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/payment.divinity.fitness/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/payment.divinity.fitness/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = payment.divinity.fitness) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


	listen 80;
	server_name payment.divinity.fitness;
    return 404; # managed by Certbot
}
